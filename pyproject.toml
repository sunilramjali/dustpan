[project]
name = "dustpan"
version = "0.1.0"
description = "Wallet hygiene companion MCP for Tangem: recover dust, ignore what isn't worth gas, quarantine spam and address-poisoning lookalikes."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.scripts]
dustpan = "dustpan.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
